name: pegasus
description: A lightweight, token-efficient AI chat app powered by Gemini.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0                # networking
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3               # local conversation storage
  sqflite_common_ffi: ^2.3.3    # required for sqflite to work on Windows/Linux desktop
  path: ^1.9.0                 # required by sqflite for db path joining
  path_provider: ^2.1.3        # finds the on-device db directory
  flutter_markdown: ^0.7.3     # renders **bold**, lists, code blocks
  file_picker: ^8.0.0          # file attachment picker
  mime: ^1.0.5                 # detects attachment mime type
  intl: ^0.19.0                # conversation timestamp formatting
  uuid: ^4.4.0                  # generates conversation/message ids

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
